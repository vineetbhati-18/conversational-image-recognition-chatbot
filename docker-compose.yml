version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bel_chatbot_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bel_chatbot_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bel_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bel_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_NAME=BEL Conversational Image Recognition Backend
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bel_chatbot_db}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bel_chatbot_db}
      - DEVICE=cpu
      - UPLOAD_DIR=/app/uploads
      - CONFIDENCE_THRESHOLD=0.35
      - ALLOWED_ORIGINS=http://localhost,http://localhost:3000,http://localhost:80
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - bel_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bel_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - bel_network

volumes:
  pgdata:
  uploads_data:

networks:
  bel_network:
    driver: bridge
